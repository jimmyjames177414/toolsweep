name: Release

# Manual only. Publishing is a decision, not a side effect of merging.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Tag or commit to publish
        required: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - uses: astral-sh/setup-uv@v5

      - name: Install
        run: uv sync --python 3.12 --extra dev

      # Never publish something that does not pass its own checks.
      - name: Verify
        run: |
          uv run pytest -m "not live"
          uv run ruff check .
          uv run ruff format --check .
          uv run mypy --strict src/

      - name: Build
        run: uv build

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      # PyPI trusted publishing: no long-lived token is stored in this repository.
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
