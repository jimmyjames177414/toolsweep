name: Bug report
description: Something toolsweep did that it should not have
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Before filing: if a *number* looks wrong, please include the run directory
        contents if you can. `trials.jsonl` is raw and append-only, so it usually shows
        exactly what happened.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What did toolsweep do, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: The exact command
      render: shell
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Output
      description: The table, or the traceback.
      render: text
  - type: input
    id: version
    attributes:
      label: toolsweep version
      placeholder: output of `toolsweep --version`
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python version and OS
    validations:
      required: true
  - type: dropdown
    id: provider
    attributes:
      label: Provider
      options: [mock, cassette, openai-compatible]
    validations:
      required: true
